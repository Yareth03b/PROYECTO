<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UNAB - ÁREA DE TRANSPORTE</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- Top Header Banner -->
  <header class="hud-header">
    <div class="brand">
      <img src="logo-unab.png" alt="Logo UNAB" class="unab-logo" />
      <div class="brand-text">
        <h1>ÁREA DE TRANSPORTE</h1>
      </div>
      <div class="brand-divider"></div>
    </div>

    <nav class="toolbar">
      <button id="btn-mode-fps" class="btn active" title="Caminar en 1ra Persona (WASD)">
        Modo Caminata (WASD)
      </button>

      <!-- Vistas Rápidas integradas en el Nav con desplegable y botón X -->
      <div class="nav-dropdown">
        <button id="btn-toggle-views" class="btn" title="Abrir menú de vistas rápidas">
          Vistas Rápidas
        </button>
        <div id="views-dropdown-menu" class="dropdown-menu hidden">
          <div class="dropdown-header">
            <span>Vistas de Cámara</span>
            <button id="btn-close-views" class="close-btn" title="Cerrar">&times;</button>
          </div>
          <button class="preset-btn" data-view="iso">Vista General Isométrica</button>
          <button class="preset-btn" data-view="datacenter">Cuarto de Servidores (Rack)</button>
          <button class="preset-btn" data-view="cabling">Paso de Cableado / Techo</button>
          <button class="preset-btn" data-view="monitoring">Monitores GPS Buses</button>
          <button class="preset-btn" data-view="door" id="btn-toggle-doors">Abrir / Cerrar Puertas</button>
        </div>
      </div>

      <button id="btn-toggle-ceiling" class="btn active" title="Mostrar/Ocultar Falso Cielo Raso (Tecla T)">
        Techo: ON
      </button>
      <button id="btn-toggle-packets" class="btn active" title="Animar tráfico de red en los cables (Tecla C)">
        Flujo de Datos: ON
      </button>
      <button id="btn-toggle-walls" class="btn" title="Bajar muros para ver mejor el cableado (Tecla M)">
        Vista Muros: Normal
      </button>
      <button id="btn-toggle-labels" class="btn active" title="Mostrar etiquetas sobre equipos (Tecla L)">
        Etiquetas: ON
      </button>
    </nav>
  </header>

  <!-- Equipment Inspector Panel (Right Side, hidden until an equipment is clicked) -->
  <aside id="inspector-panel" class="inspector-panel hidden">
    <div class="inspector-header">
      <span id="inspector-category" class="badge">DETALLE DE EQUIPO</span>
      <button id="btn-close-inspector" class="close-btn close-pill" title="Cerrar ventana (Tecla E)">E &times;</button>
    </div>
    <h2 id="inspector-title">Equipo</h2>
    <p id="inspector-desc"></p>
    <div id="inspector-specs" class="specs-grid"></div>
    <button id="btn-open-console" class="console-open-btn">
      Abrir Sistema / Configurar (Tecla F)
    </button>
  </aside>

  <!-- Interactive Device Console Modal (Cisco Packet Tracer + UNAB GPS Live Console) -->
  <div id="device-modal" class="device-modal-backdrop hidden">
    <div class="device-modal">
      <div class="device-modal-header">
        <div class="device-modal-title-group">
          <span id="modal-device-badge" class="badge">CONSOLA INTERACTIVA</span>
          <h3 id="modal-device-title">Configuración de Equipo</h3>
        </div>
        <button id="btn-close-modal" class="close-btn close-pill" title="Cerrar consola (Tecla E)">E &times;</button>
      </div>
      <div id="modal-tabs" class="device-modal-tabs"></div>
      <div id="modal-body" class="device-modal-body"></div>
    </div>
  </div>

  <!-- First Person Crosshair & Instructions Overlay -->
  <div id="fps-crosshair" class="fps-crosshair">
    <div class="crosshair-dot"></div>
    <div id="fps-hint" class="fps-hint">
      Haz <b>Click</b> en un equipo &bull; <b>Tecla F</b> usar monitor/consola &bull; <b>Tecla E</b> cerrar &bull; <b>ESC</b> Vista General
    </div>
  </div>

  <!-- Hover Tooltip -->
  <div id="hover-tooltip" class="hover-tooltip hidden"></div>

  <!-- 3D Canvas Container -->
  <div id="canvas-container"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
